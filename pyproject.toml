[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-codex-context-pipeline"
version = "0.3.4"
description = "Distill local Codex chats into Thread Notes, Decision Records, and Working Context dashboards."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tuckn" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
tkn-codex-context = "tkn_codex_context.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tkn_codex_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tkn_codex_context"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
